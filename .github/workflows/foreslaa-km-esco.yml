name: Foreslå koblinger kompetansemål ↔ ESCO

# Startes bare manuelt, fordi hver kjøring koster penger (Claude API). Forslagene committes rett på main som SSSOM uten
# kontrollør (sandkassen tar automatiske koblinger med og retter i etterkant), og arbeidslistene (CSV) lastes opp som
# et artefakt. Pushen gjøres med GITHUB_TOKEN og utløser derfor ikke innlastingen; den nattlige kjøringen tar dem med.
on:
  workflow_dispatch:
    inputs:
      laereplaner:
        description: 'Læreplankoder, kommaseparert (tomt = velg automatisk)'
        required: false
        default: ''
      antall:
        description: 'Antall læreplaner når de velges automatisk'
        required: false
        default: '8'
      effort:
        description: 'Effort for modellen'
        type: choice
        options: [medium, high, xhigh]
        default: high
      maks_dollar:
        description: 'Kostnadsgrense i USD for kjøringen'
        required: false
        default: '10'

# Samme gruppe som innlastingen og komprimeringen: forslagene leser kompetansemålene fra endepunktet, og under en
# innlasting kan grafen være tom. (GitHub holder bare én ventende kjøring per gruppe; en ventende pulje kan derfor bli
# avbrutt av en ny innlasting. Da er det bare å starte den på nytt; den har ikke kostet noe.)
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  foreslaa:
    runs-on: ubuntu-latest
    permissions:
      contents: write # committer forslagene på main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer Anthropic-SDK
        run: pip install --quiet anthropic

      - name: Lag forslag
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LAEREPLANER: ${{ inputs.laereplaner }}
          ANTALL: ${{ inputs.antall }}
          EFFORT: ${{ inputs.effort }}
          MAKS_DOLLAR: ${{ inputs.maks_dollar }}
        run: |
          if [ -n "$LAEREPLANER" ]; then UTVALG=(--laereplaner "$LAEREPLANER"); else UTVALG=(--antall "$ANTALL"); fi
          python -I -X utf8 scripts/foreslaa-km-esco.py "${UTVALG[@]}" --effort "$EFFORT" --maks-dollar "$MAKS_DOLLAR" \
            --arbeidsliste "$RUNNER_TEMP/forslag"

      - name: Lag km-esco.ttl på nytt
        run: python -I -X utf8 scripts/lag-km-esco-ttl.py

      - name: Arbeidslister (CSV)
        uses: actions/upload-artifact@v4
        with:
          name: arbeidslister-km-esco-${{ github.run_id }}
          path: ${{ runner.temp }}/forslag/*.csv
          if-no-files-found: warn

      - name: Commit på main
        run: |
          if git diff --quiet -- ontologi/koblinger && [ -z "$(git ls-files --others --exclude-standard ontologi/koblinger)" ]; then
            echo "Ingen nye forslag." ; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ontologi/koblinger
          git commit -q -m "km-esco: automatiske koblinger (kjøring ${{ github.run_id }}, ikke vurdert)"
          for forsok in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            [ "$forsok" = 3 ] && { echo "::error::Fikk ikke pushet til main"; exit 1; }
            sleep 5
          done
          echo "Committet på main: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
