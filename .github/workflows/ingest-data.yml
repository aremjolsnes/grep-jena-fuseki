name: Ingest Grep Data

on:
  schedule:
    - cron: '30 1 * * *' # 02:30 norsk vintertid (CET) / 03:30 sommertid (CEST). Cron i GitHub går i UTC. Udirs nattlige eksport er ferdig ca. 01:20.
  workflow_dispatch: # Mulighet for å starte manuelt
  push:
    branches: [main]
    paths: # Endringer i ontologi, regler eller innlastingslogikk skal slå gjennom uten å vente på Udir
      - 'ontologi/**'
      - 'sparql/**'
      - 'scripts/nattlig-innlasting.sh'
      - '.github/workflows/ingest-data.yml'

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # scripts/rapporter-avvik.sh oppretter, kommenterer og lukker issuen «Avvik i Grep-dataene»
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Installer Apache Jena (RIOT)
        run: |
          # Maven Central (archive.apache.org har vært utilgjengelig fra runneren); SHA-512 fra Apaches .sha512
          wget -q https://repo1.maven.org/maven2/org/apache/jena/apache-jena/5.3.0/apache-jena-5.3.0.tar.gz
          echo "996e2fd103ea6211c2f20d80402df83982375d58b3a967aa90e68cf5499a21d16e0b70a39716c28ad3b7ff2666cf875930ca76d0179536ab7e70778c136d81c1  apache-jena-5.3.0.tar.gz" | sha512sum -c -
          tar -xf apache-jena-5.3.0.tar.gz
          echo "RIOT=$(pwd)/apache-jena-5.3.0/bin/riot" >> "$GITHUB_ENV"

      - name: Last inn til Fuseki
        env:
          FUSEKI_URL: ${{ secrets.FUSEKI_PROD_URL }}
          FUSEKI_USER: ${{ secrets.FUSEKI_USER }}
          FUSEKI_PASSWORD: ${{ secrets.FUSEKI_PASSWORD }}
          DATASET: "ds"
          # Planlagt kjøring hopper over når endrings-id er uendret; manuell kjøring og push laster alltid
          TVING: ${{ github.event_name != 'schedule' && '1' || '0' }}
          AVVIK_FIL: ${{ runner.temp }}/avvik.md
        run: bash scripts/nattlig-innlasting.sh

      - name: Rapporter avvik i dataene
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/rapporter-avvik.sh "${{ runner.temp }}/avvik.md"

      # TDB2 beholder gamle versjoner av dataene, og hver innlasting legger igjen en hel kopi.
      # Avviksfilen skrives bare når noe faktisk ble lastet inn, så den avgjør om det trengs.
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Komprimer databasen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -f "${{ runner.temp }}/avvik.md" ]; then
            bash scripts/komprimer.sh
          else
            echo "Ingenting ble lastet inn. Hopper over komprimering."
          fi

  # GitHub deaktiverer planlagte workflows når repoet har vært uten aktivitet i 60 dager
  # (det skjedde i mai 2026). Denne jobben lager en tom commit når siste commit er eldre
  # enn 50 dager. "[skip ci]" hindrer at commiten trigger deploy.yml (ny Fly-deploy).
  keepalive:
    runs-on: ubuntu-latest
    if: always()
    needs: ingest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lag tom commit ved lang inaktivitet
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE_DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "Siste commit er $AGE_DAYS dager gammel."
          if [ "$AGE_DAYS" -lt 50 ]; then
            echo "Ingen keepalive nødvendig."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: hindrer at planlagte workflows deaktiveres [skip ci]"
          git push
