# Tilgangskontroll for Fuseki sitt administrasjons-API (/$/...).
# Kopieres til $FUSEKI_BASE/shiro.ini ved oppstart (se Dockerfile).
#
# Administrasjon (opprette/slette datasett, backup osv.) er kun tilgjengelig fra
# localhost, dvs. via `fly ssh console`. Fra internett gir /$/** 403.
#
# Tilgang til selve datasettet (/ds/...) styres IKKE her, men i config.ttl
# (fuseki:allowedUsers) sammen med passordfilen (--passwd --auth=basic).

[main]
ssl.enabled = false
localhostFilter = org.apache.jena.fuseki.authz.LocalhostFilter

[urls]
/$/status  = anon
/$/server  = anon
/$/ping    = anon
/$/metrics = anon
/$/**      = localhostFilter
/**        = anon
